name: Publish BCS Tool Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish BCS Tool
    runs-on: windows-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify tag matches BCSTool.csproj version
        shell: pwsh
        run: |
          $versionNode = Select-Xml `
            -Path ".\BCSTool\BCSTool.csproj" `
            -XPath "/Project/PropertyGroup/Version"

          if ($null -eq $versionNode) {
              throw "Could not find <Version> in BCSTool.csproj."
          }

          $projectVersion = $versionNode.Node.InnerText.Trim()
          $expectedTag = "v$projectVersion"
          $actualTag = "${{ github.ref_name }}"

          Write-Host "Project version: $projectVersion"
          Write-Host "Expected tag:    $expectedTag"
          Write-Host "Actual tag:      $actualTag"

          if ($actualTag -ne $expectedTag) {
              throw "Release tag '$actualTag' does not match project version '$projectVersion'. Expected '$expectedTag'."
          }

          $publishedExeName = "BCS Tool v$projectVersion.exe"
          $releaseAssetName = "BCS.Tool.v$projectVersion.exe"
          "PUBLISHED_EXE_NAME=$publishedExeName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ASSET_NAME=$releaseAssetName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Published file:  $publishedExeName"
          Write-Host "Release asset:   $releaseAssetName"

      - name: Publish BCS Tool
        shell: pwsh
        run: |
          & ".\BCSTool\Publish-SingleExe.ps1"

      - name: Verify release executable
        shell: pwsh
        run: |
          $exe = ".\BCSTool\publish\$env:PUBLISHED_EXE_NAME"

          if (-not (Test-Path $exe)) {
              throw "Expected release executable was not produced: $exe"
          }

          Write-Host "Release executable:"
          Get-Item $exe | Format-List Name, Length, LastWriteTime

      - name: Prepare release assets and generate SHA-256 checksum
        shell: pwsh
        run: |
          $publishedExe = ".\BCSTool\publish\$env:PUBLISHED_EXE_NAME"
          $releaseAsset = ".\BCSTool\publish\$env:RELEASE_ASSET_NAME"
          Move-Item -LiteralPath $publishedExe -Destination $releaseAsset

          $checksumFile = "$releaseAsset.sha256"
          $hash = (Get-FileHash $releaseAsset -Algorithm SHA256).Hash.ToLowerInvariant()

          "$hash  $env:RELEASE_ASSET_NAME" |
              Set-Content -Path $checksumFile -Encoding ascii

          Write-Host "SHA-256:"
          Get-Content $checksumFile

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            ".\BCSTool\publish\$env:RELEASE_ASSET_NAME" `
            ".\BCSTool\publish\$env:RELEASE_ASSET_NAME.sha256" `
            --verify-tag `
            --generate-notes `
            --title "BCS Tool ${{ github.ref_name }}"
